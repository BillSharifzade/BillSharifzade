<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Sharifzoda Bilol — Backend Architect</title>
  <desc id="hero-desc">Backend Architect · AI Architecture Specialist · Full-Stack Developer. Dushanbe, Tajikistan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c14"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.50"/>
      <stop offset="0.45" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c7d2fe" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
    <clipPath id="typewriter">
      <rect x="0" y="100" width="0" height="100">
        <animate attributeName="width" from="0" to="760" dur="1.1s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0 0.35 1"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <ellipse cx="990" cy="150" rx="440" ry="280" fill="url(#glow)">
      <animate attributeName="rx" values="440;500;440" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="280;320;280" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="90" cy="370" rx="360" ry="180" fill="url(#glow)" opacity="0.55"/>

    <g opacity="0.6" transform="rotate(-16 600 170)">
      <rect x="-1400" y="40" width="1200" height="1" fill="url(#beam)">
        <animate attributeName="x" values="-1400;1300" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="-1400" y="190" width="1000" height="1" fill="url(#beam)" opacity="0.7">
        <animate attributeName="x" values="-1400;1300" dur="11s" begin="2.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="-1400" y="300" width="800" height="1" fill="url(#beam)" opacity="0.45">
        <animate attributeName="x" values="-1400;1300" dur="13s" begin="5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(985 170)">
      <circle r="150" fill="none" stroke="#818cf8" stroke-opacity="0.22" stroke-width="1"/>
      <circle r="105" fill="none" stroke="#818cf8" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 6"/>
      <circle r="60" fill="none" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
        <circle cx="150" cy="0" r="5" fill="#c7d2fe"/>
        <circle cx="150" cy="0" r="11" fill="#c7d2fe" fill-opacity="0.18"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="140" to="-220" dur="13s" repeatCount="indefinite"/>
        <circle cx="105" cy="0" r="4" fill="#818cf8"/>
        <circle cx="105" cy="0" r="9" fill="#818cf8" fill-opacity="0.2"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="230" to="590" dur="8s" repeatCount="indefinite"/>
        <circle cx="60" cy="0" r="3.5" fill="#e3d3d3"/>
      </g>

      <circle r="30" fill="none" stroke="#818cf8" stroke-width="1">
        <animate attributeName="r" values="14;46" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.55;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="10" fill="#818cf8">
        <animate attributeName="r" values="9;12;9" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="4" fill="#ffffff"/>
    </g>

    <text x="72" y="98" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#818cf8">
      <tspan fill="#6b7280">~ $</tspan> whoami
    </text>

    <g clip-path="url(#typewriter)" transform="translate(72 0)">
      <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Sharifzoda Bilol<tspan fill="#818cf8" font-weight="400">_<animate attributeName="fill-opacity" values="1;1;0;0" dur="1.1s" begin="1.6s" repeatCount="indefinite"/></tspan></text>
    </g>

    <text x="72" y="216" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#d6c8c8" opacity="0">
      Backend Architect <tspan fill="#818cf8">·</tspan> AI Architecture Specialist <tspan fill="#818cf8">·</tspan> Full-Stack Developer
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.6s" fill="freeze"/>
    </text>

    <rect x="72" y="238" width="0" height="2" fill="url(#rule)">
      <animate attributeName="width" from="0" to="180" dur="0.9s" begin="1.9s" fill="freeze" calcMode="spline" keySplines="0.25 0 0.35 1"/>
    </rect>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15.5" fill="#9a9aa6">
      <text x="72" y="276" opacity="0">Rust · Go · C · Python — high-load systems for fintech, telecom &amp; government
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" dur="12s" begin="2.2s" repeatCount="indefinite"/>
      </text>
      <text x="72" y="276" opacity="0">Head of Software @ Azal Telecommunications · Co-Founder &amp; CEO @ 4Byte
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" dur="12s" begin="5.2s" repeatCount="indefinite"/>
      </text>
      <text x="72" y="276" opacity="0">Building apiweave: one #[operation], served over every protocol
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" dur="12s" begin="8.2s" repeatCount="indefinite"/>
      </text>
      <text x="72" y="276" opacity="0">Teaching teams Unix philosophy, security and applied AI
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" dur="12s" begin="11.2s" repeatCount="indefinite"/>
      </text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#6b7280" opacity="0">
      <circle cx="78" cy="304" r="3.5" fill="#818cf8"/>
      <text x="90" y="309">Dushanbe, Tajikistan</text>
      <text x="290" y="309" fill="#818cf8">billsharifzade.github.io</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.2s" fill="freeze"/>
    </g>
  </g>
</svg>
